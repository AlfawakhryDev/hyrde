name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build needs these to EXIST, not to be real. Nothing in CI talks to
      # Supabase or Anthropic; the real values live in Vercel and never here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
      ANTHROPIC_API_KEY: ci-placeholder-not-a-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # same major as production on Vercel
          cache: npm

      - name: Install (exactly what the lockfile says)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (warning count is capped; it may only go down)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit (production deps, high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
